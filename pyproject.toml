[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aite"
version = "0.1.0"
description = "AI Test & Evaluation Framework - unified evaluation for LLM / Agent / RAG + performance, reliability, safety"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "aite contributors" }]
keywords = ["llm", "evaluation", "testing", "benchmark", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "aiolimiter>=1.1",
]

[project.optional-dependencies]
# Judges talk to model APIs over plain REST (httpx), no vendor SDK required.
judge = []
# 功能测试（engine: pytest）：场景用例由 pytest 子进程执行，需额外装 pytest。
functional = [
    "pytest>=8.2",
]
bench = [
    "datasets>=2.19",
    "huggingface_hub>=0.23",
]
# SWE-bench 打分（swe_resolution 指标）：harness 以 CLI 子进程调用，
# aite 不 import 其 API；打分另需本机 Docker（Linux x86_64 镜像）。
swe = [
    "swebench>=5.0",
]
# 通用 HTTP 压测（engine: locust）：locust 子进程执行，aite 不直接依赖其 API。
locust = [
    "locust>=2.20",
]
# 可靠性 chaos（模块 I）：进程发现/注入经 psutil（懒加载，缺失优雅降级）。
chaos = [
    "psutil>=5.9",
]
agent = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
]
safety = [
    "sentence-transformers>=3.0",
]
mysql = [
    "aiomysql>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest-xdist>=3.5",
]

[project.scripts]
aite = "aite.cli.main:main"

[project.urls]
Homepage = "https://github.com/example/ai-test-framework"

[tool.hatch.build.targets.wheel]
packages = ["aite"]

[tool.hatch.build.targets.sdist]
include = ["aite", "examples", "docs", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -n 4"   # xdist 并行（实测 auto 在 Windows 上 worker 启动税反超收益）；单测调试 -n0 关闭
# 默认值全集 + fixtures（防主套件误收集 tests/fixtures 下的离线场景用例，
# pytest 子进程由适配器 argv 清空该选项兜底）。写全会替换默认值，勿删默认项。
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "fixtures",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# 架构分层合同（CLAUDE.md 原则的机器化门禁，提交前 lint-imports 必须零违例）。
# ignore_imports = 架构债台账：每条豁免须注明理由与撤销条件，撤销豁免即重构里程碑。
[tool.importlinter]
root_package = "aite"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "四层架构: 接口层 -> service -> 域工具 -> storage/gateway -> 插件层 -> core -> 基础层"
type = "layers"
layers = [
    "aite.cli",
    "aite.web",
    "aite.service",
    "aite.tools | aite.chaos",
    "aite.functional",
    "aite.storage",
    "aite.gateway",
    "aite.datasets | aite.connectors | aite.metrics | aite.reporting",
    "aite.core",
    "aite.events | aite.utils",
]
ignore_imports = [
    # 组合根: engine 装配 repo/gateway、注册 builtin 组件（注册外移入口层后逐条撤销）
    "aite.core.engine -> aite.storage.repositories",
    "aite.core.engine -> aite.storage.db",
    "aite.core.engine -> aite.connectors",
    "aite.core.engine -> aite.datasets",
    "aite.core.engine -> aite.datasets.catalog",
    "aite.core.engine -> aite.metrics",
    "aite.core.engine -> aite.reporting",
    "aite.core.engine -> aite.reporting.renderers",
    "aite.core.engine -> aite.gateway.llm_gateway",
    "aite.core.context -> aite.gateway.llm_gateway",
    # loader 为 metrics:auto 懒加载内置数据集（随注册外移撤销）
    "aite.core.loader -> aite.datasets.builtin",
    # TokenUsage 沉降中性层后撤销
    "aite.utils.cost -> aite.core.types",
]

[[tool.importlinter.contracts]]
name = "插件域不直接 import 彼此 (跨域只走 interfaces/registry)"
type = "forbidden"
source_modules = ["aite.connectors", "aite.datasets", "aite.metrics", "aite.reporting"]
forbidden_modules = ["aite.connectors", "aite.datasets", "aite.metrics", "aite.reporting"]
ignore_imports = [
    # 经 core 的注册/懒加载间接链（同上，注册外移后撤销；届时可升级为 independence 合同）
    "aite.core.engine -> aite.connectors",
    "aite.core.engine -> aite.datasets",
    "aite.core.engine -> aite.datasets.catalog",
    "aite.core.engine -> aite.metrics",
    "aite.core.engine -> aite.reporting",
    "aite.core.engine -> aite.reporting.renderers",
    "aite.core.loader -> aite.datasets.builtin",
]
