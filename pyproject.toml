[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aite"
version = "0.1.0"
description = "AI Test & Evaluation Framework - unified evaluation for LLM / Agent / RAG + performance, reliability, safety"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "aite contributors" }]
keywords = ["llm", "evaluation", "testing", "benchmark", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "aiolimiter>=1.1",
]

[project.optional-dependencies]
# Judges talk to model APIs over plain REST (httpx), no vendor SDK required.
judge = []
bench = [
    "datasets>=2.19",
    "huggingface_hub>=0.23",
]
agent = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
]
safety = [
    "sentence-transformers>=3.0",
]
mysql = [
    "aiomysql>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aite = "aite.cli.main:main"

[project.urls]
Homepage = "https://github.com/example/ai-test-framework"

[tool.hatch.build.targets.wheel]
packages = ["aite"]

[tool.hatch.build.targets.sdist]
include = ["aite", "examples", "docs", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# 默认值全集 + fixtures（防主套件误收集 tests/fixtures 下的离线场景用例，
# pytest 子进程由适配器 argv 清空该选项兜底）。写全会替换默认值，勿删默认项。
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "fixtures",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
