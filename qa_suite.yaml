run_name: qa-suite
description: 文本 QA 数据集评测（local sample_qa，开放式短答案）

target:
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b
  api_key_env: OPENAI_API_KEY      # optional for local servers
  params: {temperature: 0.2, max_tokens: 1024}
  rate_limit: {rpm: 120, concurrency: 8}
  stream: true                     # capture TTFT

datasets:
  - type: local
    path: ./data/sample_qa.jsonl

metrics:
  - contains: {threshold: 0.6}       # 答案包含标准答案即通过（开放式 QA 宽松口径）
  - token_f1: {threshold: 0.4}       # 词级 F1，部分正确部分给分
  - latency_p95_ms: {threshold: 30000}

pass_strategy: all_of
report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
