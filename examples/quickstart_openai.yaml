run_name: quickstart-openai
description: >
  MVP 冒烟套件：OpenAI 兼容目标（OpenAI/DeepSeek/Qwen/vLLM/Ollama 皆可）+
  内置 GSM8K 采样集 + 规则指标 + 性能指标。

target:
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b
  api_key_env: OPENAI_API_KEY
  params: {temperature: 0.2, max_tokens: 1024}
  rate_limit: {rpm: 120, concurrency: 8}
  timeout_s: 120
  max_retries: 2
  stream: true                    # 捕获 TTFT

datasets:
  - type: builtin
    id: gsm8k
    sample: {n: 10, seed: 42}
  - type: local
    path: ./examples/data/business_qa.jsonl
    limit: 5

metrics:
  - exact_match: {threshold: 0.5, extract: number}   # GSM8K 数字抽取
  - contains: {}
  - latency_p95_ms: {threshold: 30000}
  - error_rate: {threshold: 0.2}

pass_strategy: all_of
report: [rich, json, html, junit]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
