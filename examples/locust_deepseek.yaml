run_name: perf-locust
description: 性能压测（locust 引擎）：通用 HTTP 压测备选，委托 locust 子进程执行

engine: locust                     # 与 evalscope-perf 并列：非 OpenAI 端点改造/
                                   # 极端规模分布式场景用；LLM 原生指标（tpot/itl）
                                   # 需求请用 engine: evalscope-perf

target:
  type: openai_compatible
  base_url: http://localhost:11434/v1     # 云端 API 示例；本地 Ollama 换回
  model: qwen2.5:3b                      #   http://localhost:11434/v1 + qwen2.5:3b
#  api_key_env: DEEPSEEK_API_KEY             # 密钥走环境变量（禁止明文入配置/git）
                                            #   set DEEPSEEK_API_KEY=sk-xxx 后运行

perf:                              # 复用 evalscope-perf 的 perf 配置段（同键同语义）
  dataset: ./examples/data/business_qa.jsonl   # 或 prompt: 固定提示词（二选一）
  max_tokens: 1024                  # 标量定长（locust 侧无区间采样）

  mode: baseline                   # baseline / ramp / soak（probe 不支持——SLA 二分
  baseline: {parallel: 8}          #   搜索是 evalscope perf 专有，配置即报错）
#  ramp: {from: 1, to: 20, step: 2}

  duration: 120                    # 整场总时长（秒）；多档均分每档。
                                   #   与 level_duration 二选一；locust 必配其一
                                   #   （无请求数上限语义，number 配了忽略）
#  level_duration: 60            # 每档固定秒数
  spawn_rate: 4                    # 每秒拉起用户数（缺省 = 档位并发，瞬时拉满）
  # qps: 50                       # QPS 限速（闭环封顶：服务端拖慢则 QPS 下降；
  #                               #   user 数退化为并发上限。开环 QPS 用 perf.rate）
  stream: true                     # 流式逐块读，首包计时 TTFT

tools:
  metric_thresholds: {error_rate: 0.05}

storage: {url: sqlite+aiosqlite:///./aite.db}
