run_name: perf-qwen
description: 性能压测（evalscope-perf 引擎）：并发梯度扫 TTFT/吞吐/QPS，委托 evalscope perf 执行

engine: evalscope-perf             # 路由到性能适配器（压测不自研客户端，委托专业工具）

target:                             # 复用平台统一 target 配置
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b

perf:
  prompt: "请写一段大约一百字的介绍，主题：清晨的城市。"   # 固定负载提示词（数据集引用后置）
  parallel: [1, 4]                  # 并发梯度，一次 run 全扫（每档独立结果目录）
  number: 6                         # 每档采样数（标量自动对齐 parallel 长度）
  max_tokens: 128                    # 控制生成长度（负载维度）
  warmup_num: 2                     # 预热请求，不计入统计
  stream: true                      # 默认流式——非流式测不到真 TTFT

# 判定口径：显式阈值可选（换环境需自行校准），不配则只记录不判定；
# 指标名见 `aite tool benchmarks evalscope-perf`（ttft_ms/latency_p95_ms/qps/output_tps/error_rate...）
tools:
  metric_thresholds: {error_rate: 0.05}
  # extra_args:
  #   timeout: 3600                  # 整场压测总超时（秒），默认 3600

storage: {url: sqlite+aiosqlite:///./aite.db}
