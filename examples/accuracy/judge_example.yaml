module: accuracy
run_name: judge-demo
description: LLM-as-a-Judge 演示：score / pairwise（位置偏差双向）/ multi 一致性。

target:
  type: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  params: {temperature: 0.3, max_tokens: 512}

datasets:
  - type: local
    path: ./examples/fixtures/business_qa.jsonl
    sample: {n: 8, seed: 7}

metrics:
  - token_f1: {threshold: 0.3}
  - answer_relevancy: {threshold: 0.2}

judges:
  - type: score
    model:
      type: openai_compatible
      name: judge-gpt4o-mini           # gateway 内部别名
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      rate_limit: {rpm: 60}
    rubric: >
      评估回答的准确性、完整性、简洁性，1-10 打分。
      输出 JSON：{"score": <1-10>, "reasoning": "<一句话>"}
    threshold: 7.0                      # 阈值作用于 1-10 原始分
  - type: pairwise
    model:
      type: openai_compatible
      name: judge-gpt4o-mini
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
    threshold: 0.4                      # 候选对基线的胜率阈值
  - type: multi
    models:
      - {type: openai_compatible, name: judge-a, base_url: https://api.openai.com/v1,
         model: gpt-4o-mini, api_key_env: OPENAI_API_KEY}
      - {type: anthropic, name: judge-b, model: claude-3-5-haiku,
         api_key_env: ANTHROPIC_API_KEY}
    threshold: 6.0
    params: {aggregation: mean}         # mean | median

pass_strategy: all_of
max_cost_usd: 2.0                       # judge 成本熔断
report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
