module: accuracy
run_name: rag-regression
description: >
  RAG 场景规则口径回归（无 LLM 判官、零成本、确定性）：开卷形态——检索文档组装进
  prompt，token_f1/contains 做答案质量的快速回归。RAGAS 五件套（faithfulness /
  context_precision / context_recall / answer_correctness / answer_relevancy）
  走 engine: evalscope-rageval（开源 ragas 后端，适配器实装中，见 roadmap
  「存量自研指标迁移」）。

target:
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b
  stream: false

datasets:
  - type: local
    path: ./data/datasets/debug/rgb_openbook.jsonl   # 开卷：资料进 prompt，rgb 四个子集
    group_by: subset                                 # rejection 等子集分开看，别混均值
  # 闭卷冒烟（裸问答）与更多 RAG 数据集：
  # - {type: builtin, id: rgb}
  # - {type: builtin, id: crudrag}
  # 私域集（aite dataset gen-domain 生成）：{type: builtin, id: finance_private}

metrics:                                  # 规则口径，宁缺毋错不依赖判官
  - token_f1: {threshold: 0.15}           # 答案与参考的词级重合
  - contains: {threshold: 0.3}            # 参考答案关键片段命中

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
