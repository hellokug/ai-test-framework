module: accuracy
run_name: truthful_qa
description: >
  TruthfulQA 真实性（multiple_choice 选择版，8.17k 生成版不在本基准）：
  mc1/mc2 多选规则判分，报告指标 multi_choice_acc。不设门槛——mc1
  （单选）与 mc2（真选项集合评分）随机基线不同，混口径门槛易误导；
  要判定可在报告出来后按口径单独定线。

engine: evalscope

target:
  profile: deepseek                 # 引用 data/common.yaml 预制端点（deepseek-chat）

tools:
  datasets: [truthful_qa]
  limit_per_subset: 5               # 冒烟抽 5 题；真评删除此行跑全量 817 题
  resume: true
  extra_args:
    eval_batch_size: 10
    timeout_s: 14400
    generation_config:
      timeout: 900
      max_tokens: 4096
      temperature: 0
    # python_exe 已由 data/common.yaml 的 tools 缺省提供，无需在此重抄

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
