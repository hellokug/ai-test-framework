module: accuracy
run_name: math_500
description: >
  MATH-500 竞赛数学（OpenAI 自 MATH 抽样 500 题，Level 1-5 五档难度）：
  \boxed{} 答案抽取 + 数值等价规则判分（无判官）。钉 Level 1 × 5 题冒烟；
  真评删掉 dataset_args 跑全档位（limit 也按需删）。max_tokens 8192 兜住
  长推理链；数学等价判定要更严可另配 judge 走 LLM 判官（规则判分缺省即用）。

engine: evalscope

target:
  profile: deepseek                 # 引用 data/common.yaml 预制端点（deepseek-chat）

tools:
  datasets: [math_500]
  limit_per_subset: 5               # 每难度档条数（冒烟）；真评删除此行
  resume: true
  extra_args:
    eval_batch_size: 10
    timeout_s: 14400
    dataset_args:
      math_500: {subset_list: ["Level 1"]}   # 钉最易档冒烟；真评删除此段
    generation_config:
      timeout: 900
      max_tokens: 8192
      temperature: 0
    # python_exe 已由 data/common.yaml 的 tools 缺省提供，无需在此重抄

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
