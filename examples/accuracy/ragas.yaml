module: accuracy
run_name: ragas-rgb
description: >
  RAGAS 五件套评测（开源 ragas 官方实现，经 evalscope RAGEval 后端）：faithfulness /
  context_precision / context_recall / answer_correctness / answer_relevancy。
  公信力来自 ragas 本身，aite 只做数据转换与结果归一。
  依赖：pip install 'evalscope[rag]'（装在跑 aite 的环境，或用
  tools.extra_args.python_exe 指向装好的环境）。

engine: evalscope-rageval

target:                                # 方案 A：先调被测模型出答案再打分
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b
  stream: false
  # 方案 B（评测现成 RAG 输出，如 ai_study 的 RAG 系统）：删掉 target 段，
  # 数据集每条记录自带 response 字段即可直接打分

tools:
  datasets:
    - ./data/datasets/debug/rgb_openbook.jsonl   # 开卷：资料进 prompt；也认 builtin id（如 rgb）
    # 方案 B 的现成输出记录形态：
    # {"user_input"/"question", "response"/"answer", "retrieved_contexts", "reference"}
  metric_thresholds:
    faithfulness: 0.6
    context_precision: 0.5

rageval:
  raise_exceptions: true               # 定位用：判官失败直接抛真实异常（定位完改回 false 出分数）
  batch_size: 2                        # 限判官并发，缓解限流导致的 NaN
  metrics:                             # 官方 ragas 指标名（= ragas.metrics 属性）
    - faithfulness
    - context_precision
    - context_recall
  judge:                               # 判官模型（建议 70B+ 或闭源模型保证评分稳定）
    base_url: https://api.deepseek.com/v1
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY      # 运行前 set DEEPSEEK_API_KEY=sk-xxx
    max_tokens: 8192                   # 判分 JSON 输出上限（ragas 缺省 1024 会截断）
  embeddings:                          # 必配（evalscope RAGEval 必填字段）
    model_name_or_path: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    # ⚠️ torch < 2.6 的环境必须选 safetensors 权重的模型（CVE-2025-32434 防护，
    # transformers 拒绝 torch.load .bin）——BAAI/bge-large-zh-v1.5 只有 .bin 会炸；
    # sentence-transformers 官方组织模型均带 safetensors。多语言小模型 ~470MB。
    provider: huggingface
  language: chinese

report: [rich, json]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
