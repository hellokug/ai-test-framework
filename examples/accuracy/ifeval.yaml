module: accuracy
run_name: ifeval
description: >
  IFEval 指令遵循（541 条含可机器验证指令的 prompt：字数/格式/语言/
  关键词约束等）：四种规则口径全进报告——prompt 级（整条全对）×
  inst 级（逐条指令）× strict/loose。开放生成题无随机基线，不设门槛。

engine: evalscope

target:
  profile: deepseek                 # 引用 data/common.yaml 预制端点（deepseek-chat）

tools:
  datasets: [ifeval]
  limit_per_subset: 5               # 冒烟抽 5 题；真评删除此行跑全量 541 题
  resume: true
  extra_args:
    eval_batch_size: 10
    timeout_s: 14400
    generation_config:
      timeout: 900
      max_tokens: 4096
      temperature: 0
    # python_exe 已由 data/common.yaml 的 tools 缺省提供，无需在此重抄

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
