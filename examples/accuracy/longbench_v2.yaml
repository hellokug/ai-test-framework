module: accuracy
run_name: longbench_v2
description: >
  LongBench-v2 长文本理解 MCQ（503 题，4 选 1，上下文 2k-2M 词按
  short/medium/long 分档）：字母规则判分。钉 short 档 × 5 题冒烟——
  deepseek-chat 64K 上下文覆盖 short（4k-16k 词），medium/long 需要
  长窗模型再放档。长上下文预填充慢，单请求 timeout 放宽到 900s。

engine: evalscope

target:
  profile: deepseek                 # 引用 data/common.yaml 预制端点（deepseek-chat）

tools:
  datasets: [longbench_v2]
  limit_per_subset: 5               # 每长度档条数（冒烟）；真评删除此行
  metric_thresholds: {mean_acc: 0.25}   # 4 选 1 随机基线作门槛
  resume: true
  extra_args:
    eval_batch_size: 10
    timeout_s: 14400
    dataset_args:
      longbench_v2: {subset_list: [short]}   # 钉最短档冒烟；换档/加档改此段
    generation_config:
      timeout: 900
      max_tokens: 4096
      temperature: 0
    # python_exe 已由 data/common.yaml 的 tools 缺省提供，无需在此重抄

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
