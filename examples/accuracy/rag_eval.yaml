module: accuracy
run_name: rag-eval-demo
description: RAG 评测：检索质量（context precision/recall、hit@k）+ 生成质量（faithfulness、answer relevancy、引用）。

target:
  type: openai_compatible
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b
  stream: false

datasets:
  - type: builtin
    id: hotpotqa                        # 自带 retrieval_context 的多跳 QA 样例
    sample: {n: 8, seed: 1}

metrics:
  - token_f1: {threshold: 0.15}
  - context_recall: {threshold: 0.4}
  - context_precision: {threshold: 0.3}
  - hit_rate: {threshold: 0.6, k: 3}
  - faithfulness: {threshold: 0.4}      # 有 gateway 时走 LLM 断言，否则 token 重叠回退
  - answer_relevancy: {threshold: 0.15}
  - citation_accuracy: {}

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
