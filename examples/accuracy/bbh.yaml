module: accuracy
run_name: bbh
description: >
  BBH（BIG-Bench Hard）27 子任务多步推理（3-shot CoT）：短答案精确匹配
  规则判分（无判官）。钉 date_understanding × 5 题冒烟；真评删掉
  dataset_args 与 limit_per_subset 跑全量 27 子任务。各子任务题型异质
  （MCQ/短解答），随机基线不齐，不设统一门槛。

engine: evalscope

target:
  profile: deepseek                 # 引用 data/common.yaml 预制端点（deepseek-chat）

tools:
  datasets: [bbh]
  limit_per_subset: 5               # 每子任务条数（冒烟）；真评删除此行
  resume: true
  extra_args:
    eval_batch_size: 10
    timeout_s: 14400
    dataset_args:
      bbh: {subset_list: [date_understanding]}   # 27 子任务抽 1 个冒烟；真评删除此段
    generation_config:
      timeout: 900
      max_tokens: 4096
      temperature: 0
    # python_exe 已由 data/common.yaml 的 tools 缺省提供，无需在此重抄

report: [rich, json, html]
output_dir: ./reports
storage: {url: sqlite+aiosqlite:///./aite.db}
